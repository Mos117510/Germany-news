<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Deutschland-Update</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111827;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;background:#f5f7fbcc;backdrop-filter:blur(10px);padding:10px 0;z-index:2}.brand{font-weight:800;font-size:22px}.sub{color:#667085;font-size:13px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#111827;color:white;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0 4px}.tab{border:1px solid #d0d5dd;background:white;border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}.tab.active{background:#111827;color:white;border-color:#111827}.period-meta{font-size:12px;color:#667085;margin-top:8px}.btn:disabled{opacity:.55}.actions{display:flex;gap:7px;align-items:center}.lang,select{border:1px solid #d0d5dd;background:white;border-radius:10px;padding:9px 8px;font-weight:700;color:#111827}.ar{direction:rtl;text-align:right}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000008}.date{font-size:14px;color:#667085}.overview{font-size:17px;line-height:1.55}.section h2{font-size:18px;margin:22px 0 8px}.item{padding:13px 0;border-top:1px solid #eef0f3}.item:first-child{border-top:0}.title{font-weight:750}.text{line-height:1.5;margin-top:5px}.new{font-size:11px;background:#e8fff1;color:#087443;border-radius:6px;padding:3px 6px;margin-left:6px;font-weight:800}.src{font-size:12px;color:#667085;margin-top:7px}.src a{color:#475467;text-decoration:none}.archive button{margin:4px 5px 4px 0;border:1px solid #d0d5dd;background:white;border-radius:9px;padding:7px 10px}.status{color:#667085;font-size:13px;margin:8px 0}.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.empty{text-align:center;padding:35px 10px;color:#667085}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 30px #0003;z-index:10;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:600px){.top{align-items:flex-start}.brand{font-size:19px}.btn{padding:10px 12px}.card{border-radius:15px;padding:15px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand" id="brand">&#127465;&#127466; Deutschland-Update</div><div class="sub" id="sub">Nur tagesschau.de + ZDFheute</div></div><div class="actions"><select id="lang" aria-label="Sprache"><option value="de">Deutsch</option><option value="en">English</option><option value="ar">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</option></select><button id="refresh" class="btn">&#8635; Aktualisieren</button></div></div><div class="tabs"><button class="tab active" data-view="today">Heute</button><button class="tab" data-view="weekly">Woche</button><button class="tab" data-view="monthly">Monat</button></div><div id="status" class="status"></div><section id="today"></section><div id="toast" class="toast" role="status" aria-live="polite"></div><section class="card archive"><b id="archiveLabel">Archiv</b><div id="archive" class="status">Wird geladen &#8230;</div></section></main><script>
const $=s=>document.querySelector(s);let cache=[],view='today',periodCache={weekly:null,monthly:null},language=localStorage.getItem('news-lang')||'de',selectedDay=null;
function esc(s=''){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showToast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}
const UI={
 de:{brand:'\ud83c\udde9\ud83c\uddea Deutschland-Update',sub:'Nur tagesschau.de + ZDFheute',today:'Heute',weekly:'Woche',monthly:'Monat',refresh:'\u21bb Aktualisieren',archive:'Archiv',loading:'Wird geladen \u2026',noArchive:'Noch kein Archiv.',noToday:'Noch kein Update f\u00fcr heute. Dr\u00fccke \u201eAktualisieren".',noWeek:'Noch kein Wochenr\u00fcckblick f\u00fcr diese Woche. Dr\u00fccke \u201eAktualisieren".',noMonth:'Noch kein Monatsr\u00fcckblick f\u00fcr diesen Monat. Dr\u00fccke \u201eAktualisieren".',save:'Gespeichert.',refreshingToday:'Aktualisiere die verf\u00fcgbaren Quellen und erstelle das Tagesupdate \u2026',refreshingWeekly:'Erstelle den Wochenr\u00fcckblick aus den gespeicherten Tagesupdates \u2026',refreshingMonthly:'Erstelle den Monatsr\u00fcckblick aus den gespeicherten Tagesupdates \u2026',periodSaved:'R\u00fcckblick gespeichert.',translate:'\u00dcbersetze \u2026',translated:'\u00dcbersetzung gespeichert.'},
 en:{brand:'\ud83d\udcf0 Germany News Update',sub:'Only tagesschau.de + ZDFheute',today:'Today',weekly:'Week',monthly:'Month',refresh:'\u21bb Refresh',archive:'Archive',loading:'Loading \u2026',noArchive:'No archive yet.',noToday:'No update for today yet. Press "Refresh".',noWeek:'No weekly review for this week yet. Press "Refresh".',noMonth:'No monthly review for this month yet. Press "Refresh".',save:'Saved.',refreshingToday:'Updating the available sources and creating today\u2019s update \u2026',refreshingWeekly:'Creating the weekly review from the saved daily updates \u2026',refreshingMonthly:'Creating the monthly review from the saved daily updates \u2026',periodSaved:'Review saved.',translate:'Translating \u2026',translated:'Translation saved.'},
 ar:{brand:'\ud83d\udcf0 \u062a\u062d\u062f\u064a\u062b \u0623\u062e\u0628\u0627\u0631 \u0623\u0644\u0645\u0627\u0646\u064a\u0627',sub:'\u0641\u0642\u0637 tagesschau.de + ZDFheute',today:'\u0627\u0644\u064a\u0648\u0645',weekly:'\u0627\u0644\u0623\u0633\u0628\u0648\u0639',monthly:'\u0627\u0644\u0634\u0647\u0631',refresh:'\u21bb \u062a\u062d\u062f\u064a\u062b',archive:'\u0627\u0644\u0623\u0631\u0634\u064a\u0641',loading:'\u062c\u0627\u0631\u064d \u0627\u0644\u062a\u062d\u0645\u064a\u0644 \u2026',noArchive:'\u0644\u0627 \u064a\u0648\u062c\u062f \u0623\u0631\u0634\u064a\u0641 \u0628\u0639\u062f.',noToday:'\u0644\u0627 \u064a\u0648\u062c\u062f \u062a\u062d\u062f\u064a\u062b \u0644\u0644\u064a\u0648\u0645 \u0628\u0639\u062f. \u0627\u0636\u063a\u0637 \u00ab\u062a\u062d\u062f\u064a\u062b\u00bb.',noWeek:'\u0644\u0627 \u062a\u0648\u062c\u062f \u0645\u0631\u0627\u062c\u0639\u0629 \u0623\u0633\u0628\u0648\u0639\u064a\u0629 \u0644\u0647\u0630\u0627 \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0628\u0639\u062f. \u0627\u0636\u063a\u0637 \u00ab\u062a\u062d\u062f\u064a\u062b\u00bb.',noMonth:'\u0644\u0627 \u062a\u0648\u062c\u062f \u0645\u0631\u0627\u062c\u0639\u0629 \u0634\u0647\u0631\u064a\u0629 \u0644\u0647\u0630\u0627 \u0627\u0644\u0634\u0647\u0631 \u0628\u0639\u062f. \u0627\u0636\u063a\u0637 \u00ab\u062a\u062d\u062f\u064a\u062b\u00bb.',save:'\u062a\u0645 \u0627\u0644\u062d\u0641\u0638.',refreshingToday:'\u062c\u0627\u0631\u064d \u062a\u062d\u062f\u064a\u062b \u0627\u0644\u0645\u0635\u0627\u062f\u0631 \u0627\u0644\u0645\u062a\u0627\u062d\u0629 \u0648\u0625\u0646\u0634\u0627\u0621 \u062a\u062d\u062f\u064a\u062b \u0627\u0644\u064a\u0648\u0645 \u2026',refreshingWeekly:'\u062c\u0627\u0631\u064d \u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0623\u0633\u0628\u0648\u0639\u064a\u0629 \u0645\u0646 \u0627\u0644\u062a\u062d\u062f\u064a\u062b\u0627\u062a \u0627\u0644\u064a\u0648\u0645\u064a\u0629 \u0627\u0644\u0645\u062d\u0641\u0648\u0638\u0629 \u2026',refreshingMonthly:'\u062c\u0627\u0631\u064d \u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0634\u0647\u0631\u064a\u0629 \u0645\u0646 \u0627\u0644\u062a\u062d\u062f\u064a\u062b\u0627\u062a \u0627\u0644\u064a\u0648\u0645\u064a\u0629 \u0627\u0644\u0645\u062d\u0641\u0648\u0638\u0629 \u2026',periodSaved:'\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629.',translate:'\u062c\u0627\u0631\u064d \u0627\u0644\u062a\u0631\u062c\u0645\u0629 \u2026',translated:'\u062a\u0645 \u062d\u0641\u0638 \u0627\u0644\u062a\u0631\u062c\u0645\u0629.'}
};
function applyUI(){const u=UI[language];document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';$('#brand').textContent=u.brand;$('#sub').textContent=u.sub;$('#refresh').textContent=u.refresh;$('#archiveLabel').textContent=u.archive;document.querySelector('[data-view="today"]').textContent=u.today;document.querySelector('[data-view="weekly"]').textContent=u.weekly;document.querySelector('[data-view="monthly"]').textContent=u.monthly;$('#archive').classList.toggle('ar',language==='ar');}
async function translateCurrent(){
 if(language==='de'){render();return;}
 const key=view==='today'?(selectedDay||window.todayData?.day):periodCache[view]?.key;
 if(!key){render();return;}
 $('#status').textContent=UI[language].translate;
 try{const r=await fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:view==='today'?'daily':view,key,language})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Translation failed');if(view==='today')window.displayData=x;else periodCache[view]=x;render();$('#status').textContent=UI[language].translated;}catch(e){$('#status').textContent='Error: '+e.message;}
}
function renderDaily(x){if(!x){$('#today').innerHTML=`<div class="card empty">${UI[language].noToday}</div>`;return;}if(x.noNews){$('#today').innerHTML='<div class="card empty">'+esc(x.message)+'</div>';return;}let h=`<div class="card"><div class="date">${esc(new Date(x.day+'T12:00:00').toLocaleDateString(language==='ar'?'ar':'en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}))}</div><p class="overview">${esc(x.overview)}</p></div>`;for(const s of x.sections||[]){h+=`<div class="card section"><h2>${esc(s.name)}</h2>`;for(const it of s.items||[]){const links=(it.urls||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${language==='de'?'Quelle':language==='en'?'Source':'\u0627\u0644\u0645\u0635\u062f\u0631'}</a>`).join(' \u00b7 ');h+=`<div class="item"><div class="title">${esc(it.title)}${it.new?'<span class="new">NEW</span>':''}</div><div class="text">${esc(it.text)}</div><div class="src">${links}</div></div>`}h+='</div>'}if(x.failures?.length)h+=`<div class="card warn">${language==='de'?'Eine Quelle war beim Aktualisieren nicht erreichbar: ':language==='en'?'One source was unavailable during refresh: ':'\u062a\u0639\u0630\u0631 \u0627\u0644\u0648\u0635\u0648\u0644 \u0625\u0644\u0649 \u0623\u062d\u062f \u0627\u0644\u0645\u0635\u0627\u062f\u0631 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u062a\u062d\u062f\u064a\u062b: '}${esc(x.failures.join(', '))}.</div>`;$('#today').innerHTML=h;}
function renderPeriod(x,type){const u=UI[language];if(!x){$('#today').innerHTML=`<div class="card empty">${type==='weekly'?u.noWeek:u.noMonth}</div>`;return;}if(x.noNews){$('#today').innerHTML=`<div class="card empty">${esc(x.message)}</div>`;return;}const label=type==='weekly'?u.weekly:u.monthly;let h=`<div class="card"><div class="date">${label}</div><p class="overview">${esc(x.overview)}</p><div class="period-meta">${language==='de'?'Zusammengef\u00fchrt aus':'Combined from'} ${x.days?.length||0} ${language==='de'?'gespeicherten Tagesupdates. Wiederholte Ereignisse wurden zusammengefasst.':language==='en'?'saved daily updates. Repeated events were consolidated.':'\u062a\u062d\u062f\u064a\u062b\u0627\u062a \u064a\u0648\u0645\u064a\u0629 \u0645\u062d\u0641\u0648\u0638\u0629. \u062a\u0645 \u062f\u0645\u062c \u0627\u0644\u0623\u062d\u062f\u0627\u062b \u0627\u0644\u0645\u062a\u0643\u0631\u0631\u0629.'}</div></div>`;for(const s of x.sections||[]){h+=`<div class="card section"><h2>${esc(s.name)}</h2>`;for(const it of s.items||[]){const days=(it.days||[]).map(d=>new Date(d+'T12:00:00').toLocaleDateString(language==='ar'?'ar':'en-GB',{day:'2-digit',month:'2-digit'})).join(', ');h+=`<div class="item"><div class="title">${esc(it.title)}</div><div class="text">${esc(it.text)}</div>${days?`<div class="src">${language==='de'?'Behandelt in den Tagesupdates:':language==='en'?'Covered in daily updates:':'\u0648\u0631\u062f \u0641\u064a \u0627\u0644\u062a\u062d\u062f\u064a\u062b\u0627\u062a \u0627\u0644\u064a\u0648\u0645\u064a\u0629: '} ${esc(days)}</div>`:''}</div>`}h+='</div>'}$('#today').innerHTML=h;}
function render(){if(view==='today')renderDaily(window.displayData||window.todayData);else renderPeriod(periodCache[view],view);}
function renderArchive(){const u=UI[language];$('#archive').innerHTML=cache.map(x=>`<button data-day="${esc(x.day)}">${esc(new Date(x.day+'T12:00:00').toLocaleDateString(language==='ar'?'ar':'en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}))}</button>`).join('')||u.noArchive;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=async()=>{view='today';selectedDay=b.dataset.day;window.todayData=cache.find(x=>x.day===selectedDay);window.displayData=window.todayData;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view==='today'));if(language!=='de')await translateCurrent();else render();});}
async function load(){const [t,h,w,m]=await Promise.all([fetch('/api/today'),fetch('/api/history'),fetch('/api/weekly'),fetch('/api/monthly')]);window.todayData=await t.json();window.displayData=window.todayData;cache=await h.json();periodCache.weekly=await w.json();periodCache.monthly=await m.json();selectedDay=window.todayData?.day||null;applyUI();render();renderArchive();if(language!=='de' && (window.todayData||periodCache.weekly||periodCache.monthly))await translateCurrent();}
async function refreshCurrent(){const b=$('#refresh');b.disabled=true;const u=UI[language];$('#status').textContent=view==='today'?u.refreshingToday:view==='weekly'?u.refreshingWeekly:u.refreshingMonthly;try{const endpoint=view==='today'?'/api/refresh':`/api/${view}`;const r=await fetch(endpoint,{method:'POST'});const x=await r.json();if(!r.ok)throw new Error(x.error||'Error');if(x.noNews){showToast(x.message);$('#status').textContent=x.message;return;}if(view==='today'){window.todayData=x;selectedDay=x.day;window.displayData=x;cache=await (await fetch('/api/history')).json();if(language!=='de')await translateCurrent();else renderDaily(x);renderArchive();$('#status').textContent=u.save;}else{periodCache[view]=x;if(language!=='de')await translateCurrent();else renderPeriod(x,view);$('#status').textContent=u.periodSaved;}}catch(e){$('#status').textContent='Error: '+e.message;}finally{b.disabled=false;}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=async()=>{view=t.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));if(view==='today')window.displayData=window.todayData;render();if(language!=='de'&&((view==='today'&&window.todayData)||(view!=='today'&&periodCache[view])))await translateCurrent();});
$('#lang').value=language;$('#lang').onchange=async e=>{language=e.target.value;localStorage.setItem('news-lang',language);applyUI();if(view==='today')window.displayData=window.todayData;await translateCurrent();renderArchive();};
$('#refresh').onclick=refreshCurrent;load().catch(e=>$('#status').textContent='Error: '+e.message);
</script></body></html>
